name: Release

# Cut a release by pushing a semantic-version tag on a commit that is on main
# (see Contributing → Releasing):
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# charmkit's own module tags (charmkit/vX.Y.Z) do not match the trigger.
#
# Releases ship Linux only: amd64 and arm64.
#
# Every build job is read-only. Only `publish` can write: it attests the
# archives' build provenance (SLSA, verifiable with `gh attestation verify`)
# and creates this tag's GitHub release, with the archives `make package`
# builds and the SHA256SUMS manifest that lists them.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: The tag is a semantic version on main
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - name: The version the build embeds is the tag
        run: test "$(make -s version)" = "${GITHUB_REF_NAME}"
      - name: Builds the way go install will
        # Workspace off: charmkit resolves as the tagged module go.mod
        # requires, through the public module proxy and checksum database.
        run: GOWORK=off go build ./...
      - run: make vet test

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pure Go with CGO off, so one runner cross-compiles both architectures.
      - run: make package VERSION="${GITHUB_REF_NAME}"
      - run: cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # Each archive is unpacked and run on the architecture it is for, so a
    # binary that cannot start never reaches the release.
    name: smoke (${{ matrix.platform }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            os: ubuntu-latest
          - platform: linux_arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Each smoke test takes a minute or two.
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Run the archived binary
        run: |
          name="mrman_${GITHUB_REF_NAME}_${{ matrix.platform }}"
          (cd dist && grep " ${name}.tar.gz\$" SHA256SUMS | sha256sum -c -)
          tar -xzf "dist/${name}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${name}/mrman" --version | grep -F "${GITHUB_REF_NAME}"

  publish:
    needs: [package, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/mrman_*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
