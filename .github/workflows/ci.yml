name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dev tools
        run: make tools
      - name: Formatting is clean
        run: make fmt && git diff --exit-code
      - name: Vet, lint, test, coverage gate, charmkit
        run: make vet lint test cover-check check-charmkit
      - name: Fuzz smoke
        run: |
          for pkg in ./internal/vcs/diffparser ./internal/patch; do
            if go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep -q '^Fuzz'; then
              go test -run='^$' -fuzz='^Fuzz' -fuzztime=20s "$pkg"
            fi
          done
      - name: Vulnerability scan
        run: |
          govulncheck ./...
          (cd charmkit && govulncheck ./...)
      - name: go.mod is tidy
        run: make tidy

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go vet ./...
      - run: cd charmkit && go build ./... && go vet ./...

  release-shape:
    # `go install github.com/infrashift/mrman@vX.Y.Z` builds with the workspace
    # disabled; see the Makefile for why this cannot pass until charmkit is
    # tagged. Advisory until the first release, then flip to a hard failure.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go build ./...
