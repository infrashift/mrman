name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# charmkit is a tagged module inside this private repository, so every go
# command that loads the module graph must fetch its go.mod through git
# with the job's token, and skip the public checksum database for it.
env:
  GOPRIVATE: github.com/infrashift

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Authenticate module fetches for this repository
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: Install dev tools
        run: make tools
      - name: Formatting is clean
        run: make fmt && git diff --exit-code
      - name: Vet, lint, test, coverage gate, charmkit
        run: make vet lint test cover-check check-charmkit
      - name: Race detector
        # The TUI runs forge requests, session saves and agent merges on
        # several goroutines; the plain test run cannot see a data race.
        run: make test-race
      - name: Fuzz smoke
        run: |
          for pkg in ./internal/vcs/diffparser ./internal/patch; do
            if go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep -q '^Fuzz'; then
              go test -run='^$' -fuzz='^Fuzz' -fuzztime=20s "$pkg"
            fi
          done
      - name: Vulnerability scan
        run: |
          govulncheck ./...
          (cd charmkit && govulncheck ./...)
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Authenticate module fetches for this repository
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - run: go build ./... && go vet ./...
      - run: cd charmkit && go build ./... && go vet ./...

  release-shape:
    # `go install github.com/infrashift/mrman@vX.Y.Z` builds with the workspace
    # disabled, resolving charmkit as a tagged module from this repository.
    # The repository is private, so the module fetch authenticates with the
    # job's own token and skips the public checksum database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Authenticate module fetches for this repository
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - run: GOWORK=off go build ./...
      - run: make tidy
