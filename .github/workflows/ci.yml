name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dev tools
        run: make tools
      - name: Formatting is clean
        run: make fmt && git diff --exit-code
      - name: Vet, lint, test, coverage gate, charmkit
        run: make vet lint test cover-check check-charmkit
      - name: Race detector
        # The TUI runs forge requests, session saves and agent merges on
        # several goroutines; the plain test run cannot see a data race.
        run: make test-race
      - name: Fuzz smoke
        run: |
          for pkg in ./internal/vcs/diffparser ./internal/patch; do
            if go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep -q '^Fuzz'; then
              go test -run='^$' -fuzz='^Fuzz' -fuzztime=20s "$pkg"
            fi
          done
      - name: Vulnerability scan
        run: |
          govulncheck ./...
          (cd charmkit && govulncheck ./...)

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go vet ./...
      - run: cd charmkit && go build ./... && go vet ./...

  release-shape:
    # The two ways mrman ships. `go install github.com/infrashift/mrman@vX.Y.Z`
    # builds with the workspace disabled, resolving charmkit as a tagged
    # module through the public module proxy and checksum database. A tag
    # also publishes the archives `make package` builds (release.yml): each
    # holds the binary in a versioned directory, listed in SHA256SUMS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOWORK=off go build ./...
      - run: make tidy
      - run: make package PLATFORMS=linux/amd64 VERSION=v0.0.0-ci
      - name: Archive holds a working binary, listed in SHA256SUMS
        run: |
          name=mrman_v0.0.0-ci_linux_amd64
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/mrman" --version | grep -F 'v0.0.0-ci'

  docs:
    # docs-release.yml deploys only from main; this catches a page that does
    # not build while it is still in review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: make docs-build
