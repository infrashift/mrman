name: Deploy Docs to GitHub Pages

# Publishes the Astro site in docs/ to https://infrashift.github.io/mrman/.
# The repository's Pages source must be "GitHub Actions" (Settings → Pages):
# with "Deploy from a branch", GitHub runs its own Jekyll build of docs/
# instead, and the deploy step below has no Pages site to publish to.
#
# CI's docs job builds the same site on every pull request, so a page that
# does not build is caught in review rather than here.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build with Astro
        uses: withastro/action@v5
        with:
          path: ./docs
          # Pinned: the action otherwise auto-detects the package manager from
          # whichever lockfile it finds, and docs/ commits a bun.lock. The
          # version matches the one that wrote bun.lock and CI's docs job.
          package-manager: bun@1.3.9

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
