version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - copyloopvar
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
  exclusions:
    generated: lax
    paths:
      - .reference

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/infrashift/mrman
  exclusions:
    paths:
      - .reference
